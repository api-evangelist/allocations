openapi: 3.2.0
info:
  title: Allocations Providers API
  description: ''
  version: 1.0.0
  termsOfService: https://allocations.com
  contact:
    name: Allocations Support
    url: https://allocations.com
    email: support@allocations.com
servers:
- url: https://api.allocations.com
security:
- jwt: []
tags:
- name: Providers
paths:
  /providers/{provider}/check-status:
    get:
      x-controller-name: ProvidersController
      x-operation-name: checkProvider
      tags:
      - Providers
      operationId: checkProviderStatus
      responses:
        '200':
          description: True if provider is accessible and token is valid, false otherwise
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid provider or parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
                        example: BadRequestError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 401
                      name:
                        type: string
                        example: UnauthorizedError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      parameters:
      - name: provider
        in: path
        schema:
          type: string
          enum:
          - CCH
          description: Provider identifier
        required: true
      summary: Check provider status
      x-summary-source: derived
  /providers/{provider}/renew-token:
    post:
      x-controller-name: ProvidersController
      x-operation-name: renewToken
      tags:
      - Providers
      operationId: renewProviderToken
      responses:
        '200':
          description: URL to redirect user to for OAuth token renewal
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid provider or parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
                        example: BadRequestError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 401
                      name:
                        type: string
                        example: UnauthorizedError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      parameters:
      - name: provider
        in: path
        schema:
          type: string
          enum:
          - CCH
          description: Provider identifier
        required: true
      summary: Renew provider token
      x-summary-source: derived
  /providers/{provider}/token:
    get:
      x-controller-name: ProvidersController
      x-operation-name: ingestToken
      tags:
      - Providers
      operationId: ingestProviderToken
      responses:
        '200':
          description: True if token was successfully ingested and stored, false otherwise
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid provider or parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
                        example: BadRequestError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '404':
          description: Provider credentials not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 404
                      name:
                        type: string
                        example: NotFoundError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      parameters:
      - name: provider
        in: path
        schema:
          type: string
          enum:
          - CCH
          description: Provider identifier
        required: true
      - name: code
        in: query
        schema:
          type: string
          description: OAuth authorization code from provider
        required: true
      summary: Ingest provider token
      x-summary-source: derived
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
