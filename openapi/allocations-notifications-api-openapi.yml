                - error
      summary: Mark all notifications read
      x-summary-source: derived
  /v2/notifications/settings/{type}/{enabled}:
    post:
      x-controller-name: NotificationsController
      x-operation-name: setNotificationSettingsByType
      tags:
      - Notifications
      operationId: setNotificationSettingByType
      responses:
        '200':
          description: Notification setting updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether email notifications are enabled
        '400':
          description: Invalid notification type or enabled value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
