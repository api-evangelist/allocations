openapi: 3.2.0
info:
  title: Allocations Notifications API
  description: Call-to-actions and informational data
  version: 1.0.0
  termsOfService: https://allocations.com
  contact:
    name: Allocations Support
    url: https://allocations.com
    email: support@allocations.com
servers:
- url: https://api.allocations.com
security:
- jwt: []
tags:
- name: Notifications
  description: Call-to-actions and informational data
paths:
  /v2/notifications/count:
    get:
      x-controller-name: NotificationsController
      x-operation-name: getNotificationsCount
      tags:
      - Notifications
      operationId: getNotificationsCount
      responses:
        '200':
          description: Notification count retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  read:
                    type: number
                    description: Number of read notifications
                  unread:
                    type: number
                    description: Number of unread notifications
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 401
                      name:
                        type: string
                        example: UnauthorizedError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      summary: Get notifications count
      x-summary-source: derived
  /v2/notifications/notify/k1-available/{entityId}/{taxYear}:
    post:
      x-controller-name: NotificationsController
      x-operation-name: notifyEntityLpsK1
      tags:
      - Notifications
      operationId: notifyLPsK1Available
      responses:
        '200':
          description: K-1 notification sent successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Email address of notification recipient
        '400':
          description: Invalid entity or tax year data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
                        example: BadRequestError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 401
                      name:
                        type: string
                        example: UnauthorizedError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 404
                      name:
                        type: string
                        example: NotFoundError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      parameters:
      - name: entityId
        in: path
        schema:
          type: string
        required: true
      - name: taxYear
        in: path
        schema:
          type: number
        required: true
      - name: previewRecipients
        in: query
        schema:
          type: boolean
      summary: Notify LPs K1Available
      x-summary-source: derived
  /v2/notifications/notify/k1-available/{taxYear}:
    post:
      x-controller-name: NotificationsController
      x-operation-name: notifyEntityLpsK1AllEntities
      tags:
      - Notifications
      operationId: notifyLPsK1AvailableBulk
      responses:
        '200':
          description: Bulk K-1 notifications sent successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    notification:
                      $ref: '#/components/schemas/Notifications'
                    users:
                      type: array
                      items:
                        type: string
                      description: User IDs who received the notification
                    emails:
                      type: array
                      items:
                        type: string
                      description: Email addresses of notification recipients
                    actions:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                      description: Action button configuration
        '400':
          description: Invalid tax year or entity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
                        example: BadRequestError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 401
                      name:
                        type: string
                        example: UnauthorizedError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      parameters:
      - name: taxYear
        in: path
        schema:
          type: number
        required: true
      - name: previewRecipients
        in: query
        schema:
          type: boolean
      summary: Notify LPs K1Available bulk
      x-summary-source: derived
