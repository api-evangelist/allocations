      parameters:
      - name: filter
        in: query
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationUsers.Filter'
      summary: Get notifications
      x-summary-source: derived
components:
  schemas:
    Notification:
      title: Notification
      type: object
      description: Notification Details
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        subject:
          type:
          - string
          - 'null'
        body:
          type: string
        isCritical:
          type: boolean
      required:
      - body
      additionalProperties: false
    Notifications:
      title: Notifications
      type: object
      properties:
        id:
          type: string
        deleted:
          type: boolean
        deletedOn:
          type:
          - string
          - 'null'
          format: date-time
        deletedBy:
          type:
          - string
          - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        subject:
          type:
          - string
          - 'null'
        body:
          type: string
        options:
          type: object
        isCritical:
          type: boolean
        senderUserId:
          type: string
      required:
      - body
      additionalProperties: false
      description: Notification details
    NotificationUsers.IncludeFilter.Items:
      title: NotificationUsers.IncludeFilter.Items
      type: object
      properties:
        relation:
          type: string
          enum:
          - notification
          - user
        scope:
          $ref: '#/components/schemas/NotificationUsers.ScopeFilter'
    ListingNotification:
      title: ListingNotification
      type: object
      description: Listing notifications for the current user
      properties:
        id:
          type: string
        notificationId:
          type: string
        isRead:
          type: boolean
        types:
          type: array
          items:
            type: string
        sentDate:
          type: string
          format: date-time
        actionMeta:
          type: object
          description: Action Data for Notification, typically url and title
        userId:
          type: string
        notification:
          $ref: '#/components/schemas/Notification'
      additionalProperties: false
    NotificationUsers.ScopeFilter:
      type: object
      properties:
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          example: 100
        skip:
          type: integer
          minimum: 0
        order:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        where:
          type: object
          additionalProperties: true
        fields:
          oneOf:
          - type: object
            properties: {}
            additionalProperties: true
          - type: array
            items:
              type: string
            uniqueItems: true
        include:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
      additionalProperties: false
      title: NotificationUsers.ScopeFilter
    NotificationUsers.Filter:
      type: object
      title: NotificationUsers.Filter
      properties:
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          example: 100
        skip:
          type: integer
          minimum: 0
        order:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        where:
          title: NotificationUsers.WhereFilter
          type: object
          additionalProperties: true
        fields:
          oneOf:
          - type: object
            properties:
              id:
                type: boolean
              notificationId:
                type: boolean
              isRead:
                type: boolean
              types:
                type: boolean
              sentDate:
                type: boolean
              actionMeta:
                type: boolean
              userId:
                type: boolean
            additionalProperties: false
          - type: array
            items:
              type: string
              enum:
              - id
              - notificationId
              - isRead
              - types
              - sentDate
              - actionMeta
              - userId
              example: id
            uniqueItems: true
          title: NotificationUsers.Fields
        include:
          title: NotificationUsers.IncludeFilter
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/NotificationUsers.IncludeFilter.Items'
            - type: string
      additionalProperties: false
      x-typescript-type: '@loopback/repository#Filter<NotificationUsers>'
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
