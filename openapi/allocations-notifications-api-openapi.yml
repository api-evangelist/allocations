  /v2/notifications/{id}/read:
    patch:
      x-controller-name: NotificationsController
      x-operation-name: markNotificationAsRead
      tags:
      - Notifications
      operationId: markNotificationAsRead
      responses:
        '204':
          description: Notification marked as read successfully
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
