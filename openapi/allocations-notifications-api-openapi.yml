        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 401
                      name:
                        type: string
                        example: UnauthorizedError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '404':
          description: Notification settings not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 404
                      name:
                        type: string
                        example: NotFoundError
                      message:
                        type: string
                        example: message
                    required:
                    - statusCode
                    - name
                    - message
                required:
                - error
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      parameters:
      - name: type
        in: path
        schema:
          enum:
          - EMAIL
          type: string
        required: true
      - name: enabled
        in: path
        schema:
          type: boolean
        required: true
      summary: Set notification setting by type
      x-summary-source: derived
  /v2/notifications/settings:
    get:
      x-controller-name: NotificationsController
      x-operation-name: getNotificationSettings
      tags:
      - Notifications
      operationId: getNotificationSettings
      responses:
        '200':
          description: Notification settings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether email notifications are enabled
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
