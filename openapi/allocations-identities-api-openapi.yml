      x-operation-name: getBulkKycStatus
      tags:
      - Identities
      operationId: getBulkIdentityKycStatus
      responses:
        '200':
          description: Bulk KYC status retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    rollupStatus:
                      type: string
                      enum:
                      - submitted
                      - running
                      - completed
                      - failed
                    identity:
                      $ref: '#/components/schemas/IdentitiesWithRelations'
                    beneficialOwners:
                      type: array
                      items:
                        type: object
                        properties:
                          identity:
                            $ref: '#/components/schemas/IdentitiesWithRelations'
                          status:
                            type: string
                            enum:
                            - submitted
                            - running
                            - completed
                            - failed
        '400':
          description: Invalid request body or identity IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 400
                      name:
                        type: string
                        example: BadRequestError
                      message:
                        type: string
                        example: message
