              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      statusCode:
                        type: number
                        example: 500
                      message:
                        type: string
                        example: Internal Server Error
                    required:
                    - statusCode
                    - message
                required:
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identityIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 500
              required:
              - identityIds
              additionalProperties: false
      summary: Get bulk identity kyc status
      x-summary-source: derived
